name: Crypto Signal Scan

on:
  schedule:
    # Läuft alle 5 Minuten (UTC). So werden Stufen-Wechsel (1->2->3) schnell
    # erkannt und gemeldet. GitHub Actions garantiert keine exakte
    # Pünktlichkeit, kleine Verzögerungen von wenigen Minuten sind normal.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # erlaubt manuelles Starten über den "Run workflow" Button

permissions:
  contents: write  # nötig, damit der Bot den State (data/state.json) zurück committen kann

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Scan ausführen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m src.main

      - name: Zustand zurück ins Repo committen
        run: |
          git config --global user.name "crypto-signal-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push
